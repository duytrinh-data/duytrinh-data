<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%" role="img" aria-label="Evidence-Driven Analytics &amp; Automation Architecture">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081629" />
      <stop offset="100%" stop-color="#0E2542" />
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14325A" />
      <stop offset="100%" stop-color="#0B1D36" />
    </linearGradient>
    <style>
      .hdr { font: 800 13px 'JetBrains Mono', Consolas, monospace; fill: #75AADB; letter-spacing: 1.8px; }
      .st-num { font: 800 11px 'JetBrains Mono', Consolas, monospace; fill: #081629; }
      .st-title { font: 700 13.5px 'Segoe UI', Inter, sans-serif; fill: #FFFFFF; }
      .st-desc { font: 500 11px 'Segoe UI', Inter, sans-serif; fill: #94A3B8; }
      .st-tag { font: 700 10px 'JetBrains Mono', Consolas, monospace; fill: #75AADB; }
      @keyframes flowDash {
        to { stroke-dashoffset: -24; }
      }
      .flow-line {
        stroke: #75AADB;
        stroke-width: 2.2;
        stroke-dasharray: 6 6;
        animation: flowDash 1.2s linear infinite;
      }
    </style>
  </defs>

  <rect width="1200" height="220" rx="16" fill="url(#pipeBg)" stroke="#1E3A5F" stroke-width="1.5" />
  <text x="36" y="34" class="hdr">⚡ END-TO-END ANALYTICS &amp; AGENTIC AUTOMATION WORKFLOW</text>
  <text x="1164" y="34" text-anchor="end" font-family="Consolas, monospace" font-size="11" fill="#F6B40E">
    CONTRACT BEFORE DASHBOARD · EVIDENCE OVER ASSUMPTION
  </text>

  <!-- Animated Connecting Lines -->
  <line x1="230" y1="124" x2="266" y2="124" class="flow-line" />
  <line x1="458" y1="124" x2="494" y2="124" class="flow-line" />
  <line x1="686" y1="124" x2="722" y2="124" class="flow-line" />
  <line x1="914" y1="124" x2="950" y2="124" class="flow-line" />

  <!-- Stage 1 -->
  <g transform="translate(36, 56)">
    <rect width="204" height="136" rx="12" fill="url(#stepGrad)" stroke="#75AADB" stroke-opacity="0.45" />
    <rect x="14" y="14" width="46" height="20" rx="5" fill="#75AADB" />
    <text x="22" y="28" class="st-num">STEP 1</text>
    <text x="14" y="56" class="st-title">Business &amp; Trees</text>
    <text x="14" y="76" class="st-desc">Lock Owner, Scope,</text>
    <text x="14" y="92" class="st-desc">KPI / Metric / Logic Tree</text>
    <text x="14" y="118" class="st-tag">→ Domain Framing</text>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(266, 56)">
    <rect width="204" height="136" rx="12" fill="url(#stepGrad)" stroke="#75AADB" stroke-opacity="0.45" />
    <rect x="14" y="14" width="46" height="20" rx="5" fill="#F6B40E" />
    <text x="22" y="28" class="st-num">STEP 2</text>
    <text x="14" y="56" class="st-title">Data Contract</text>
    <text x="14" y="76" class="st-desc">Grain, Attribution, Keys,</text>
    <text x="14" y="92" class="st-desc">Data Dictionary &amp; Rules</text>
    <text x="14" y="118" class="st-tag" fill="#F6B40E">→ Schema Audit</text>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(496, 56)">
    <rect width="204" height="136" rx="12" fill="url(#stepGrad)" stroke="#75AADB" stroke-opacity="0.45" />
    <rect x="14" y="14" width="46" height="20" rx="5" fill="#38BDF8" />
    <text x="22" y="28" class="st-num">STEP 3</text>
    <text x="14" y="56" class="st-title">ETL &amp; Ingestion</text>
    <text x="14" y="76" class="st-desc">Meta Ads API, Haravan,</text>
    <text x="14" y="92" class="st-desc">AMIS, n8n &amp; SQL Staging</text>
    <text x="14" y="118" class="st-tag" fill="#38BDF8">→ Clean Pipelines</text>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(726, 56)">
    <rect width="204" height="136" rx="12" fill="url(#stepGrad)" stroke="#75AADB" stroke-opacity="0.45" />
    <rect x="14" y="14" width="46" height="20" rx="5" fill="#A78BFA" />
    <text x="22" y="28" class="st-num">STEP 4</text>
    <text x="14" y="56" class="st-title">EDA &amp; Power BI</text>
    <text x="14" y="76" class="st-desc">Descriptive/Diagnostic</text>
    <text x="14" y="92" class="st-desc">EDA, DAX &amp; Reconciliation</text>
    <text x="14" y="118" class="st-tag" fill="#A78BFA">→ Verified Measures</text>
  </g>

  <!-- Stage 5 -->
  <g transform="translate(956, 56)">
    <rect width="208" height="136" rx="12" fill="url(#stepGrad)" stroke="#10B981" stroke-opacity="0.6" />
    <rect x="14" y="14" width="46" height="20" rx="5" fill="#10B981" />
    <text x="22" y="28" class="st-num">STEP 5</text>
    <text x="14" y="56" class="st-title">Agentic Ops &amp; Apps</text>
    <text x="14" y="76" class="st-desc">Lark Base Portals, AI</text>
    <text x="14" y="92" class="st-desc">Command Center &amp; Review</text>
    <text x="14" y="118" class="st-tag" fill="#10B981">→ Repeatable System</text>
  </g>
</svg>
