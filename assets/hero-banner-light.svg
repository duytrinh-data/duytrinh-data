    <text x="14" y="142" class="mono" font-size="11" fill="#4F46E5">3-trees -&gt; contract -&gt; pbi/lark</text>

    <text x="14" y="162" class="mono" font-size="10.5" fill="#334155">$ mail  trinhdinhduy1206@gmail.com</text>
    <rect x="242" y="152" width="6" height="12" rx="1" fill="#059669" class="cursor" />
