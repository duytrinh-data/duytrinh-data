<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 244" width="864" height="244" text-rendering="geometricPrecision" role="img" aria-label="Analytics and Automation Operating Pipeline">
  <defs>
    <clipPath id="pipeClipD">
      <rect x="0.5" y="0.5" width="863" height="243" rx="10" />
    </clipPath>
    <linearGradient id="topRimD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.28" />
    </linearGradient>
    <linearGradient id="pulseBeamD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0" />
      <stop offset="65%" stop-color="#34D399" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#A7F3D0" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="stage5WashD" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.065" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.015" />
    </linearGradient>
    <style>
      .d-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .d-mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
      .d-hdr { font-size: 13px; font-weight: 600; fill: #F4F4F5; letter-spacing: -0.2px; }
      .d-sub { font-size: 10.5px; font-weight: 400; fill: #8E94A0; }
      .d-ttl { font-size: 13px; font-weight: 600; fill: #F4F4F5; letter-spacing: -0.2px; }
      .d-dsc { font-size: 11.5px; font-weight: 400; fill: #A1A1AA; }
      .d-idx { font-size: 10.5px; font-weight: 600; fill: #D4D4D8; text-anchor: middle; }
      .d-idx-live { font-size: 10.5px; font-weight: 600; fill: #34D399; text-anchor: middle; }
      .d-gate { font-size: 10.5px; font-weight: 500; fill: #D4D4D8; }
      .d-gate-live { font-size: 10.5px; font-weight: 600; fill: #34D399; }
      .d-rule { stroke: #1E222A; stroke-width: 1; }
      .d-rail { stroke: #2C313D; stroke-width: 1.25; fill: none; }
      .d-rail-live { stroke: #34D399; stroke-opacity: 0.45; stroke-width: 1.25; fill: none; }
      .d-node { fill: #0B0C0E; stroke: #2F3542; stroke-width: 1; }
      .d-node-live { fill: #0D1B16; stroke: #34D399; stroke-opacity: 0.72; stroke-width: 1; }
      .d-ico { fill: none; stroke: #7E8594; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
      .d-ico-live { fill: none; stroke: #34D399; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
      .d-chev { fill: none; stroke: #586070; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
      @keyframes flowSweepD {
        0% { transform: translateX(0px); opacity: 0; }
        7% { opacity: 1; }
        86% { opacity: 1; }
        95% { transform: translateX(772px); opacity: 0; }
        100% { transform: translateX(772px); opacity: 0; }
      }
      .d-beam { animation: flowSweepD 5.4s cubic-bezier(0.35, 0, 0.25, 1) infinite; }
      @media (prefers-reduced-motion: reduce) {
        .d-beam { animation: none; opacity: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#pipeClipD)">
    <!-- Neutral obsidian charcoal ground (zero muddy navy) -->
    <rect x="0" y="0" width="864" height="244" fill="#0B0C0E" />
    <!-- Surface-1 header bar -->
    <rect x="0" y="0" width="864" height="44" fill="#121418" />
    <!-- Surface-1 schematic conduit strip -->
    <rect x="0" y="44" width="864" height="42" fill="#0F1115" />
    <!-- Whisper-quiet single-signal wash exclusively on terminal delivery column -->
    <rect x="691" y="44" width="173" height="200" fill="url(#stage5WashD)" />
    <!-- Surface-1 gate deliverables strip -->
    <rect x="0" y="200" width="864" height="44" fill="#0F1115" />
    <!-- Specular top rim -->
    <rect x="0" y="0" width="864" height="1" fill="url(#topRimD)" />

    <!-- Horizontal architectural hairlines -->
    <line x1="0" y1="44" x2="864" y2="44" class="d-rule" />
    <line x1="0" y1="86" x2="864" y2="86" class="d-rule" />
    <line x1="0" y1="200" x2="864" y2="200" class="d-rule" />

    <!-- Exposed 1px vertical column dividers (5 equal tracks) -->
    <line x1="173" y1="44" x2="173" y2="244" class="d-rule" />
    <line x1="346" y1="44" x2="346" y2="244" class="d-rule" />
    <line x1="519" y1="44" x2="519" y2="244" class="d-rule" />
    <line x1="691" y1="44" x2="691" y2="244" class="d-rule" />

    <!-- Header content -->
    <text x="18" y="26.5" class="d-sans d-hdr">Analytics &amp; Automation Operating Pipeline</text>
    <text x="846" y="26" text-anchor="end" class="d-mono d-sub">Contract before dashboard  /  Evidence over assumption</text>

    <!-- Continuous schematic pipeline conduit across all 5 stages -->
    <line x1="32" y1="65" x2="725" y2="65" class="d-rail" />
    <line x1="737" y1="65" x2="836" y2="65" class="d-rail-live" />
    <!-- Terminal live endpoint -->
    <circle cx="841" cy="65" r="6" fill="#34D399" fill-opacity="0.14" />
    <circle cx="841" cy="65" r="2.8" fill="#34D399" />

    <!-- Single traveling emerald data-flow pulse -->
    <rect x="32" y="63.75" width="38" height="2.5" rx="1.25" fill="url(#pulseBeamD)" class="d-beam" />

    <!-- Directional chevrons at each stage handoff -->
    <path d="M 163 61.5 L 167 65 L 163 68.5" class="d-chev" />
    <path d="M 336 61.5 L 340 65 L 336 68.5" class="d-chev" />
    <path d="M 509 61.5 L 513 65 L 509 68.5" class="d-chev" />
    <path d="M 681 61.5 L 685 65 L 681 68.5" class="d-chev" />

    <!-- Stage 01 -->
    <g transform="translate(0, 0)">
      <rect x="18" y="54" width="28" height="22" rx="5" class="d-node" />
      <text x="32" y="68.5" class="d-mono d-idx">01</text>

      <text x="18" y="113" class="d-sans d-ttl">Business &amp; Trees</text>
      <circle cx="150" cy="108.5" r="6" class="d-ico" />
      <circle cx="150" cy="108.5" r="2" class="d-ico" />

      <text x="18" y="137" class="d-sans d-dsc">Lock owner, scope,</text>
      <text x="18" y="155" class="d-sans d-dsc">KPI, Metric &amp; Logic</text>
      <text x="18" y="173" class="d-sans d-dsc">Trees framing</text>

      <rect x="18" y="219.5" width="5" height="5" rx="1.2" fill="#71717A" />
      <text x="30" y="225.5" class="d-mono d-gate">Domain Framing</text>
    </g>

    <!-- Stage 02 -->
    <g transform="translate(173, 0)">
      <rect x="18" y="54" width="28" height="22" rx="5" class="d-node" />
      <text x="32" y="68.5" class="d-mono d-idx">02</text>

      <text x="18" y="113" class="d-sans d-ttl">Data Contract</text>
      <ellipse cx="150" cy="104.5" rx="5.5" ry="2.1" class="d-ico" />
      <path d="M 144.5 104.5 V 112.5 C 144.5 113.7 147 114.6 150 114.6 C 153 114.6 155.5 113.7 155.5 112.5 V 104.5" class="d-ico" />
      <path d="M 144.5 108.5 C 144.5 109.7 147 110.6 150 110.6 C 153 110.6 155.5 109.7 155.5 108.5" class="d-ico" />

      <text x="18" y="137" class="d-sans d-dsc">Lock grain, keys,</text>
      <text x="18" y="155" class="d-sans d-dsc">attribution &amp; field</text>
      <text x="18" y="173" class="d-sans d-dsc">Data Dictionary</text>

      <rect x="18" y="219.5" width="5" height="5" rx="1.2" fill="#71717A" />
      <text x="30" y="225.5" class="d-mono d-gate">Zero Fan-Out</text>
    </g>

    <!-- Stage 03 -->
    <g transform="translate(346, 0)">
      <rect x="18" y="54" width="28" height="22" rx="5" class="d-node" />
      <text x="32" y="68.5" class="d-mono d-idx">03</text>

      <text x="18" y="113" class="d-sans d-ttl">ETL &amp; Ingestion</text>
      <circle cx="145.5" cy="104.5" r="1.9" class="d-ico" />
      <circle cx="154" cy="108.5" r="1.9" class="d-ico" />
      <circle cx="145.5" cy="112.5" r="1.9" class="d-ico" />
      <path d="M 147.3 105.3 L 152.2 107.7 M 147.3 111.7 L 152.2 109.3" class="d-ico" />

      <text x="18" y="137" class="d-sans d-dsc">Meta Ads, Haravan,</text>
      <text x="18" y="155" class="d-sans d-dsc">MISA AMIS via n8n,</text>
      <text x="18" y="173" class="d-sans d-dsc">Python &amp; SQL</text>

      <rect x="18" y="219.5" width="5" height="5" rx="1.2" fill="#71717A" />
      <text x="30" y="225.5" class="d-mono d-gate">Clean Staging</text>
    </g>

    <!-- Stage 04 -->
    <g transform="translate(519, 0)">
      <rect x="18" y="54" width="28" height="22" rx="5" class="d-node" />
      <text x="32" y="68.5" class="d-mono d-idx">04</text>

      <text x="18" y="113" class="d-sans d-ttl">EDA &amp; Power BI</text>
      <line x1="145" y1="114" x2="145" y2="109" class="d-ico" />
      <line x1="149.5" y1="114" x2="149.5" y2="103.5" class="d-ico" />
      <line x1="154" y1="114" x2="154" y2="106.5" class="d-ico" />

      <text x="18" y="137" class="d-sans d-dsc">Descriptive &amp;</text>
      <text x="18" y="155" class="d-sans d-dsc">Diagnostic EDA with</text>
      <text x="18" y="173" class="d-sans d-dsc">reconciled DAX</text>

      <rect x="18" y="219.5" width="5" height="5" rx="1.2" fill="#71717A" />
      <text x="30" y="225.5" class="d-mono d-gate">Verified BI</text>
    </g>

    <!-- Stage 05 (Single Focal Signal Accent) -->
    <g transform="translate(691, 0)">
      <rect x="18" y="54" width="28" height="22" rx="5" class="d-node-live" />
      <text x="32" y="68.5" class="d-mono d-idx-live">05</text>

      <text x="18" y="113" class="d-sans d-ttl">Ops &amp; Web Apps</text>
      <rect x="144" y="103" width="12.5" height="11" rx="2" class="d-ico-live" />
      <path d="M 147 107 L 149.2 108.7 L 147 110.4 M 151.1 110.4 H 153.5" class="d-ico-live" />

      <text x="18" y="137" class="d-sans d-dsc">Lark Base HRM/Ops</text>
      <text x="18" y="155" class="d-sans d-dsc">portals &amp; React /</text>
      <text x="18" y="173" class="d-sans d-dsc">TypeScript tools</text>

      <circle cx="20.5" cy="222" r="3" fill="#34D399" />
      <text x="30" y="225.5" class="d-mono d-gate-live">Live Ops Handoff</text>
    </g>
  </g>

  <!-- Crisp outer architectural border -->
  <rect x="0.5" y="0.5" width="863" height="243" rx="10" fill="none" stroke="#262A33" stroke-width="1" />
</svg>
