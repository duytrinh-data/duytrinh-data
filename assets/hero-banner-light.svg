    <circle cx="39" cy="14" r="3.5" fill="#94A3B8" />
    <text x="135" y="17.5" text-anchor="middle" class="mono" font-size="10.5" fill="#475569">duy@ai-os ~</text>

    <text x="14" y="50" class="mono" font-size="10.5" fill="#64748B">$ focus</text>
    <text x="14" y="66" class="mono" font-size="11" fill="#059669">marketing_analytics + ops_etl</text>

