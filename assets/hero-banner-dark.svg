<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 216" width="864" height="216" text-rendering="geometricPrecision" role="img" aria-label="Trịnh Đình Duy — Business Automation and Marketing Analytics">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="55%" stop-color="#0D1321" />
      <stop offset="100%" stop-color="#0B111E" />
    </linearGradient>
    <radialGradient id="glowEmerald" cx="14%" cy="16%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowSky" cx="88%" cy="88%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="topAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <pattern id="dotGridDark" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.85" fill="#334155" opacity="0.45" />
    </pattern>
    <clipPath id="heroClip">
      <rect x="0.5" y="0.5" width="863" height="215" rx="12" />
    </clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
      .pill { fill: #111827; stroke: #1E293B; stroke-width: 1; }
      .pill-txt { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #E2E8F0; }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .live-dot { animation: pulseDot 2.4s ease-in-out infinite; }
      .cursor { animation: blinkCursor 1.1s step-end infinite; }
    </style>
  </defs>

  <g clip-path="url(#heroClip)">
    <rect x="0" y="0" width="864" height="216" fill="url(#bgDark)" />
    <rect x="0" y="0" width="864" height="216" fill="url(#dotGridDark)" />
    <rect x="0" y="0" width="864" height="216" fill="url(#glowEmerald)" />
    <rect x="0" y="0" width="864" height="216" fill="url(#glowSky)" />
    <rect x="0" y="0" width="864" height="2.5" fill="url(#topAccent)" />
  </g>
  <rect x="0.5" y="0.5" width="863" height="215" rx="12" fill="none" stroke="#1E293B" stroke-width="1" />

  <!-- Left Column: Identity -->
  <g transform="translate(28, 24)">
    <!-- Status Chip -->
    <rect x="0" y="0" width="322" height="24" rx="12" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.32" stroke-width="1" />
    <circle cx="14" cy="12" r="3.5" fill="#34D399" class="live-dot" />
    <text x="25" y="15.5" class="mono" font-size="10.5" fill="#A7F3D0">HCMIU · Data Science (Year 3) · Ho Chi Minh City</text>

    <!-- Name + Handle -->
    <text x="0" y="64" class="sans" font-size="30" font-weight="700" fill="#F8FAFC" letter-spacing="-0.6">Trịnh Đình Duy</text>
    <text x="232" y="62" class="mono" font-size="13" fill="#38BDF8">@duytrinh-data</text>

    <!-- Positioning -->
    <text x="0" y="92" class="sans" font-size="13.5" font-weight="500" fill="#E2E8F0">Business Automation &amp; Marketing Analytics Intern @ Hebekery</text>
    <text x="0" y="113" class="sans" font-size="12.5" fill="#94A3B8">Turning raw ad &amp; ERP data into Data Contracts, verified BI models, and n8n pipelines.</text>

    <!-- 4 Domain Accent Pills -->
    <g transform="translate(0, 134)">
      <rect x="0" y="0" width="114" height="28" rx="6" class="pill" />
      <circle cx="13" cy="14" r="3" fill="#38BDF8" />
      <text x="23" y="18" class="pill-txt">Python · SQL</text>

      <rect x="122" y="0" width="132" height="28" rx="6" class="pill" />
      <circle cx="135" cy="14" r="3" fill="#F59E0B" />
      <text x="145" y="18" class="pill-txt">Power BI · DAX</text>

      <rect x="262" y="0" width="122" height="28" rx="6" class="pill" />
      <circle cx="275" cy="14" r="3" fill="#F43F5E" />
      <text x="285" y="18" class="pill-txt">n8n · REST API</text>

      <rect x="392" y="0" width="126" height="28" rx="6" class="pill" />
      <circle cx="405" cy="14" r="3" fill="#34D399" />
      <text x="415" y="18" class="pill-txt">Lark · React</text>
    </g>
  </g>

  <!-- Right Column: Terminal Spec Card -->
  <g transform="translate(568, 22)">
    <rect x="0" y="0" width="270" height="172" rx="10" fill="#0B1120" fill-opacity="0.92" stroke="#1E293B" stroke-width="1" />
    <!-- Terminal Top Bar -->
    <path d="M 0 10 Q 0 0 10 0 L 260 0 Q 270 0 270 10 L 270 28 L 0 28 Z" fill="#111827" />
    <line x1="0" y1="28" x2="270" y2="28" stroke="#1E293B" stroke-width="1" />
    <circle cx="15" cy="14" r="3.5" fill="#475569" />
    <circle cx="27" cy="14" r="3.5" fill="#475569" />
    <circle cx="39" cy="14" r="3.5" fill="#475569" />
    <text x="135" y="17.5" text-anchor="middle" class="mono" font-size="10.5" fill="#94A3B8">duy@ai-os ~</text>

    <!-- Terminal Lines -->
    <text x="14" y="50" class="mono" font-size="10.5" fill="#64748B">$ focus</text>
    <text x="14" y="66" class="mono" font-size="11" fill="#34D399">marketing_analytics + ops_etl</text>

    <text x="14" y="88" class="mono" font-size="10.5" fill="#64748B">$ data_sources</text>
    <text x="14" y="104" class="mono" font-size="11" fill="#38BDF8">meta_ads · haravan · misa_amis</text>

    <text x="14" y="126" class="mono" font-size="10.5" fill="#64748B">$ workflow</text>
    <text x="14" y="142" class="mono" font-size="11" fill="#C4B5FD">3-trees -&gt; contract -&gt; pbi/lark</text>

    <text x="14" y="162" class="mono" font-size="10.5" fill="#94A3B8">$ mail  trinhdinhduy1206@gmail.com</text>
    <rect x="242" y="152" width="6" height="12" rx="1" fill="#34D399" class="cursor" />
  </g>
</svg>
