<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 216" width="864" height="216" text-rendering="geometricPrecision" role="img" aria-label="Trịnh Đình Duy — Business Automation and Marketing Analytics">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <radialGradient id="glowEmeraldL" cx="14%" cy="16%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowSkyL" cx="88%" cy="88%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="topAccentL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <pattern id="dotGridLight" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.85" fill="#CBD5E1" opacity="0.6" />
    </pattern>
    <clipPath id="heroClipL">
      <rect x="0.5" y="0.5" width="863" height="215" rx="12" />
    </clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
      .pill { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .pill-txt { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #1E293B; }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .live-dot { animation: pulseDot 2.4s ease-in-out infinite; }
      .cursor { animation: blinkCursor 1.1s step-end infinite; }
    </style>
  </defs>

  <g clip-path="url(#heroClipL)">
    <rect x="0" y="0" width="864" height="216" fill="url(#bgLight)" />
    <rect x="0" y="0" width="864" height="216" fill="url(#dotGridLight)" />
    <rect x="0" y="0" width="864" height="216" fill="url(#glowEmeraldL)" />
    <rect x="0" y="0" width="864" height="216" fill="url(#glowSkyL)" />
    <rect x="0" y="0" width="864" height="2.5" fill="url(#topAccentL)" />
  </g>
  <rect x="0.5" y="0.5" width="863" height="215" rx="12" fill="none" stroke="#CBD5E1" stroke-width="1" />

  <!-- Left Column: Identity -->
  <g transform="translate(28, 24)">
    <rect x="0" y="0" width="322" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
    <circle cx="14" cy="12" r="3.5" fill="#059669" class="live-dot" />
    <text x="25" y="15.5" class="mono" font-size="10.5" fill="#065F46">HCMIU · Data Science (Year 3) · Ho Chi Minh City</text>

    <text x="0" y="64" class="sans" font-size="30" font-weight="700" fill="#0F172A" letter-spacing="-0.6">Trịnh Đình Duy</text>
    <text x="232" y="62" class="mono" font-size="13" fill="#0284C7">@duytrinh-data</text>

    <text x="0" y="92" class="sans" font-size="13.5" font-weight="600" fill="#1E293B">Business Automation &amp; Marketing Analytics Intern @ Hebekery</text>
    <text x="0" y="113" class="sans" font-size="12.5" fill="#475569">Turning raw ad &amp; ERP data into Data Contracts, verified BI models, and n8n pipelines.</text>

    <g transform="translate(0, 134)">
